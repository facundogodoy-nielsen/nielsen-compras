<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestión de Proyectos — Nielsen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0c0a; --s1:#161310; --s2:#1f1b16; --s3:#2a251e; --s4:#342e25;
  --border:#3d3629; --border2:#4f4638;
  --or:#e85d25; --or2:#ff7440; --or3:#c44d1a; --gold:#c8a84b;
  --text:#ede8df; --muted:#7a6e5e; --subtle:#a89880;
  --green:#22c55e; --blue:#3b8ef3; --yellow:#f59e0b; --red:#ef4444; --purple:#a855f7;
  --ff:'IBM Plex Sans',sans-serif; --fm:'IBM Plex Mono',monospace; --fd:'Bebas Neue',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ff);background:var(--bg);color:var(--text);min-height:100vh;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  background-image:repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(255,255,255,.015) 39px,rgba(255,255,255,.015) 40px),
    repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(255,255,255,.015) 39px,rgba(255,255,255,.015) 40px);}
header{background:var(--s1);border-bottom:2px solid var(--or);padding:0 26px;height:66px;
  display:flex;align-items:center;gap:16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:60}
header img{height:38px}
.h-tit{font-family:var(--fd);font-size:25px;letter-spacing:2px;color:var(--text);line-height:1}
.h-tit span{color:var(--or)}
.h-sub{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.6px}
.wrap{max-width:1500px;margin:0 auto;padding:22px 26px 70px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px;flex-wrap:wrap}
.tab{padding:11px 18px;background:none;border:none;cursor:pointer;font-family:var(--ff);font-size:13px;
  font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:var(--or);border-bottom-color:var(--or)}
.tab:hover:not(.active){color:var(--subtle)}
.card{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px}
.card-t{font-family:var(--fd);font-size:15px;letter-spacing:1.4px;color:var(--or);text-transform:uppercase;margin-bottom:12px}
.btn{padding:9px 16px;border-radius:8px;border:none;background:var(--or);color:#fff;font-family:var(--ff);
  font-size:12.5px;font-weight:700;cursor:pointer;transition:.15s}
.btn:hover{background:var(--or2)}
.btn.sec{background:var(--s3);color:var(--text);border:1px solid var(--border2)}
.btn.sec:hover{background:var(--s4)}
.btn.dan{background:var(--red)}
.btn.sm{padding:5px 11px;font-size:11px}
.btn.gh{background:none;border:1px solid var(--border);color:var(--muted)}
.btn.gh:hover{color:var(--text);border-color:var(--border2)}
input,select,textarea{font-family:var(--ff);font-size:13px;padding:8px 11px;border-radius:7px;
  border:1px solid var(--border);background:var(--s2);color:var(--text);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--or)}
label{font-size:10px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);display:block;margin-bottom:4px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{padding:8px 10px;text-align:left;font-family:var(--fd);font-size:11px;letter-spacing:1.1px;
  text-transform:uppercase;color:var(--muted);background:var(--s2);border-bottom:2px solid var(--border)}
td{padding:7px 10px;border-bottom:1px solid var(--border)}
.mono{font-family:var(--fm)}
.grid{display:grid;gap:13px}
.kpi{background:var(--s1);border:1px solid var(--border);border-radius:11px;padding:14px 16px}
.kpi .v{font-family:var(--fd);font-size:27px;line-height:1;color:var(--or)}
.kpi .l{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-top:3px}
.bar{height:7px;background:var(--s3);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--or3),var(--or2));border-radius:4px;transition:width .4s}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:9.5px;font-weight:800;letter-spacing:.4px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.ov.on{display:flex}
.modal{background:var(--s1);border:1px solid var(--border2);border-radius:14px;max-width:660px;width:100%;
  max-height:90vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.65)}
.modal-h{padding:15px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.modal-h b{font-family:var(--fd);font-size:16px;letter-spacing:1.3px;color:var(--or)}
.modal-b{padding:18px 20px}
.modal-f{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:9px;justify-content:flex-end}
.muted{color:var(--muted)}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--s3);
  border:1px solid var(--or);border-radius:10px;padding:11px 20px;font-size:13px;z-index:300;
  opacity:0;pointer-events:none;transition:.25s}
.toast.on{opacity:1}
/* Gantt */
.gantt{overflow-x:auto;padding-bottom:6px}
.gantt-grid{min-width:780px}
.gantt-row{display:grid;grid-template-columns:190px 1fr;gap:10px;align-items:center;margin-bottom:6px}
.gantt-lbl{font-size:11.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gantt-track{position:relative;height:26px;background:var(--s2);border-radius:6px;border:1px solid var(--border)}
.gantt-bar{position:absolute;top:3px;height:20px;border-radius:5px;display:flex;align-items:center;
  padding:0 8px;font-size:10px;font-weight:700;color:#fff;overflow:hidden;white-space:nowrap}
.gantt-hoy{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--red);z-index:5}
@media(max-width:760px){
  header{padding:0 15px;height:60px}.wrap{padding:16px 13px 60px}
  .h-tit{font-size:20px}.card{padding:14px}
}
.toolbar{display:flex;gap:11px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.tb-grupo{display:flex;gap:9px;flex-wrap:wrap;align-items:center;flex:1;min-width:260px}
.seg{display:inline-flex;border:1px solid var(--border2);border-radius:9px;overflow:hidden;flex-shrink:0}
.seg button{padding:9px 15px;background:var(--s2);color:var(--muted);border:none;font-family:var(--ff);font-size:12.5px;font-weight:700;cursor:pointer}
.seg button.on{background:var(--or);color:#fff}
.sync-est{font-size:11px;color:var(--subtle);white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(165px,1fr));margin-bottom:16px}
.alerta{border-color:rgba(239,68,68,.45);background:rgba(239,68,68,.07)}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.t-etapas{min-width:900px}.t-pf{min-width:1050px}
.in-color{width:34px;height:30px;padding:2px;cursor:pointer}
.tag{font-size:9px;color:var(--muted);border:1px solid var(--border2);border-radius:4px;padding:0 4px;display:inline-block;margin-top:2px;font-family:var(--ff)}
.fila-link{cursor:pointer}.fila-link:hover td{background:var(--s2)}
.as-fila{display:flex;gap:10px;align-items:center;padding:8px 10px;background:var(--s2);border:1px solid var(--border);border-radius:8px;margin-bottom:6px}
.g2{grid-template-columns:1fr 1fr}
.flash{box-shadow:0 0 0 2px var(--or);transition:box-shadow .3s}
.btn:disabled{opacity:.35;cursor:default}
@media(max-width:760px){
  header img{height:28px}.h-sub{display:none}.sync-txt{display:none}.h-tit{font-size:17px!important;letter-spacing:1px}header{gap:10px}
  .g2{grid-template-columns:1fr}.tb-grupo{min-width:100%}.tab{padding:10px 11px;font-size:12px}
}
</style>
</head>

let DB=[], current=null, tabActual='dashboard', modo='proyecto';
let BASE={};          // id → copia del proyecto tal como está en la nube
let DIRTY={};         // id → true mientras hay cambios sin subir
let _saveT={}, _subiendo={}, _pendRender=false, _rtOK=false, _ultimaSync=null;
let SCS=[], CMPS=[], _comprasOK=false, _comprasTs=0;
let pfEst='activos', pfTxt='';

/* ── Utilidades ── */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=v=>String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const jsq=v=>esc(String(v==null?'':v).replace(/\\/g,'\\\\').replace(/'/g,"\\'"));
const num=n=>Math.round(Number(n)||0).toLocaleString('es-AR');
const money=(n,d)=>(d==='USD'?'US$ ':'$ ')+num(n);
const hoy=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const fmtF=d=>{ if(!d) return '—'; const p=String(d).slice(0,10).split('-'); return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:d; };
const clone=o=>JSON.parse(JSON.stringify(o));
const H=()=>({apikey:SB_KEY,Authorization:'Bearer '+SB_KEY});
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('on'),2800);}
function dias(a,b){ if(!a||!b) return 0; return Math.round((new Date(b)-new Date(a))/86400000); }
/* JSON canónico (claves ordenadas) para comparar versiones sin importar el orden que devuelve jsonb */
function canon(v){
  if(Array.isArray(v)) return '['+v.map(x=>canon(x===undefined?null:x)).join(',')+']';
  if(v&&typeof v==='object') return '{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}';
  return JSON.stringify(v===undefined?null:v);
}
function chip(txt,col){ return '<span class="chip" style="background:'+col+'22;color:'+col+';border:1px solid '+col+'55">'+esc(txt)+'</span>'; }

/* ══════════════ SINCRONIZACIÓN CON SUPABASE ══════════════ */
function setSync(st,msg){
  const el=document.getElementById('sync-est'); if(!el) return;
  const h=_ultimaSync?_ultimaSync.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}):'';
  const m={
    ok:  ['var(--green)', (_rtOK?'En vivo':'Sincronizado')+(h?' · '+h:'')],
    pend:['var(--yellow)','Guardando cambios…'],
    sync:['var(--blue)',  msg||'Sincronizando…'],
    off: ['var(--red)',   'Sin conexión — datos locales'],
    err: ['var(--red)',   'No se pudo guardar — reintentando']
  }[st]||['var(--muted)',''];
  el.innerHTML='<i class="dot" style="background:'+m[0]+'"></i><span class="sync-txt">'+esc(m[1])+'</span>';
  el.title=m[1]+(msg&&msg!==m[1]?' — '+msg:'');
}
function _cache(){ try{ localStorage.setItem(LS,JSON.stringify(DB)); }catch(e){} }
function _deFila(x){
  return x.data
    ? {...x.data, id:x.id, num:x.num||x.data.num, nombre:x.nombre||x.data.nombre, estado:x.estado||x.data.estado}
    : {id:x.id,num:x.num,nombre:x.nombre,estado:x.estado,rubros:{},planos:[],etapas:[]};
}
async function _traerProyectos(){
  const r=await fetch(SB_URL+'/rest/v1/proyectos?select=id,num,nombre,estado,data&order=num.asc&limit=1000',
    {headers:H(),cache:'no-store'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
/* Aplica lo que viene de la nube sin pisar proyectos con cambios locales pendientes */
function _aplicarFilas(rows){
  const vistos={}; let cambios=0, cambioActual=false;
  rows.forEach(x=>{
    vistos[x.id]=1;
    const rem=_deFila(x);
    if(BASE[x.id] && canon(BASE[x.id])===canon(rem)) return;
    if(DIRTY[x.id]) return;                 // se combina al guardar
    BASE[x.id]=clone(rem);
    const nuevo=_normalizar(clone(rem));
    const loc=DB.find(p=>p.id===x.id);
    if(loc){ Object.keys(loc).forEach(k=>delete loc[k]); Object.assign(loc,nuevo); if(loc===current) cambioActual=true; }
    else DB.push(nuevo);
    cambios++;
  });
  DB=DB.filter(p=>{
    if(vistos[p.id]||DIRTY[p.id]||!BASE[p.id]) return true;
    delete BASE[p.id]; if(p===current){ current=null; cambioActual=true; } cambios++; return false;
  });
  DB.sort((a,b)=>String(a.num||'').localeCompare(String(b.num||''),'es',{numeric:true}));
  _cache();
  return {cambios,cambioActual};
}
async function cargarNube(avisar){
  setSync('sync');
  try{
    const rows=await _traerProyectos();
    _aplicarFilas(rows);
    _ultimaSync=new Date(); setSync(Object.keys(DIRTY).length?'pend':'ok');
    if(avisar) toast('✅ Sincronizado con la nube');
  }catch(e){
    console.warn('nube:',e.message);
    if(!DB.length){ try{ DB=JSON.parse(localStorage.getItem(LS)||'[]'); DB.forEach(_normalizar); }catch(e2){ DB=[]; } }
    setSync('off');
    if(avisar) toast('⚠️ No se pudo sincronizar — se muestran los datos guardados');
  }
  document.getElementById('cargando').style.display='none';

let _refrescando=false;
async function refrescar(motivo){
  if(_refrescando||document.hidden) return;
  _refrescando=true;
  try{
    const rows=await _traerProyectos();
    const r=_aplicarFilas(rows);
    _ultimaSync=new Date(); setSync(Object.keys(DIRTY).length?'pend':'ok');
    Object.keys(DIRTY).forEach(id=>{ if(!_subiendo[id]) _programar(id,100); });
    let recompras=false;
    if(Date.now()-_comprasTs>60000){ await cargarCompras(true); recompras=true; }
    if(r.cambios){ _repintar(); if(r.cambioActual&&motivo!=='manual') toast('↻ Actualizado con cambios de otro usuario'); }
    else if(recompras&&(modo==='portafolio'||['dashboard','compras'].includes(tabActual))) _repintar();
  }catch(e){ setSync('off'); }
  finally{ _refrescando=false; }
}
function _editando(){

function _repintar(){

/* ── Guardado: debounce + combinación con cambios ajenos + upsert ── */
function guardar(){
  if(!current) return;
  DIRTY[current.id]=true; _cache(); setSync('pend');
  _programar(current.id,600);
}
function _programar(id,ms){ clearTimeout(_saveT[id]); _saveT[id]=setTimeout(()=>_subir(id),ms); }
async function _subir(id){
  if(_subiendo[id]){ _programar(id,400); return; }
  const p=DB.find(x=>x.id===id); if(!p){ delete DIRTY[id]; return; }
  _subiendo[id]=true;
  try{
    const r=await fetch(SB_URL+'/rest/v1/proyectos?id=eq.'+encodeURIComponent(id)+'&select=id,num,nombre,estado,data',
      {headers:H(),cache:'no-store'});
    if(!r.ok) throw new Error('lectura HTTP '+r.status);
    const rows=await r.json();
    if(rows[0]&&BASE[id]){
      const rem=_deFila(rows[0]);
      if(canon(rem)!==canon(BASE[id])){
        const m=_normalizar(_merge3(BASE[id],clone(p),rem));
        Object.keys(p).forEach(k=>delete p[k]); Object.assign(p,m);
        toast('🔀 Tus cambios se combinaron con los de otro usuario');
        if(p===current) _repintar();
      }
    }
    const snap=clone(p);
    const body={id:p.id,num:p.num||'',nombre:p.nombre||'',estado:p.estado||'planificacion',
                data:snap,actualizado_at:new Date().toISOString()};
    const w=await fetch(SB_URL+'/rest/v1/proyectos',{method:'POST',
      headers:{...H(),'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},
      body:JSON.stringify(body)});
    if(!w.ok) throw new Error('HTTP '+w.status+' '+(await w.text()).slice(0,160));
    BASE[id]=snap;
    if(canon(snap)===canon(p)) delete DIRTY[id]; else _programar(id,300);
    _cache(); _ultimaSync=new Date();
    setSync(Object.keys(DIRTY).length?'pend':'ok');
  }catch(e){
    console.warn('guardar:',e.message);
    setSync('err',e.message); _programar(id,15000);
  }finally{ delete _subiendo[id]; }
}
/* Combinación a 3 vías: base (lo último leído), local (lo mío) y remoto (lo que hay hoy en la nube).
   Lo que no toqué toma el valor remoto; lo que toqué yo se conserva. Áreas y SC se combinan por elemento. */
function _merge3(b,l,r){
  b=b||{}; l=l||{}; r=r||{};
  const out={}, keys=new Set([...Object.keys(b),...Object.keys(l),...Object.keys(r)]);
  keys.forEach(k=>{
    const cb=canon(b[k]), cl=canon(l[k]), cr=canon(r[k]);
    let v;
    if(cl===cb) v=r[k];
    else if(cr===cb||cr===cl) v=l[k];
    else if((k==='areas'||k==='etapas'||k==='planos')&&Array.isArray(l[k])&&Array.isArray(r[k])) v=_mergeLista(b[k]||[],l[k],r[k]);
    else if((k==='rubros'||k==='scs_rubro')&&l[k]&&r[k]&&typeof l[k]==='object') v=_merge3(b[k]||{},l[k],r[k]);
    else if(k==='scs_asociadas'&&Array.isArray(l[k])&&Array.isArray(r[k])){
      const quitadas=(b[k]||[]).filter(x=>l[k].indexOf(x)<0);
      v=[...new Set([...l[k],...r[k]])].filter(x=>quitadas.indexOf(x)<0);
    }
    else v=l[k];
    if(v!==undefined) out[k]=v;
  });
  return out;
}
function _mergeLista(b,l,r){
  const key=x=>x&&(x.id||x.nombre||canon(x));
  const idx=a=>{const m={};a.forEach(x=>{m[key(x)]=x;});return m;};
  const mb=idx(b),ml=idx(l),mr=idx(r), out=[];
  [...new Set([...l.map(key),...r.map(key)])].forEach(k=>{
    const B=mb[k],L=ml[k],R=mr[k];
    if(L&&R) out.push(canon(L)===canon(B)?R:L);
    else if(L){ if(!B||canon(L)!==canon(B)) out.push(L); }
    else if(R){ if(!B||canon(R)!==canon(B)) out.push(R); }
  });
  return out;
}
/* Realtime: cualquier cambio en `proyectos` (desde el CC u otro dispositivo) dispara un refresco */
function _iniciarRealtime(){
  try{
    if(!window.supabase||!window.supabase.createClient) return;
    const c=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false}});
    c.channel('gp-proyectos')
      .on('postgres_changes',{event:'*',schema:'public',table:'proyectos'},()=>{
        clearTimeout(window._rtT); window._rtT=setTimeout(()=>refrescar('rt'),700); })
      .subscribe(st=>{ _rtOK=(st==='SUBSCRIBED'); if(!Object.keys(DIRTY).length&&_ultimaSync) setSync('ok'); });
  }catch(e){ console.warn('realtime:',e.message); }
}

/* Completa la estructura sin romper los proyectos cargados desde el CC */
function _normalizar(p){
  if(!p.rubros||typeof p.rubros!=='object') p.rubros={};
  Object.keys(p.rubros).forEach(k=>{ const r=p.rubros[k]; if(!Array.isArray(r.items)) r.items=[]; if(!Array.isArray(r.cotiz)) r.cotiz=[]; });
  if(!Array.isArray(p.planos)) p.planos=[];
  if(!Array.isArray(p.areas)) p.areas=[];
  if(!Array.isArray(p.etapas)) p.etapas=[];
  if(!Array.isArray(p.scs_asociadas)) p.scs_asociadas=[];
  if(!p.scs_rubro||typeof p.scs_rubro!=='object') p.scs_rubro={};
  /* Versión anterior de este módulo: cronograma en p.gantt → se pasa a p.etapas (formato CC) */
  if(p.gantt&&!p.gantt_migrado){
    if(!p.etapas.length){
      const con=ETAPAS_STD.some(e=>{const d=p.gantt[e.id]||{};return d.ini||d.fin||Number(d.avance)>0||d.obs;});
      if(con) p.etapas=ETAPAS_STD.map(e=>{const d=p.gantt[e.id]||{};
        return {nombre:e.lbl,color:e.col,ini:d.ini||'',fin:d.fin||'',prog:Number(d.avance)||0,obs:d.obs||''};});
    }
    p.gantt_migrado=true;
  }
  p.etapas.forEach(e=>{ if(e.prog==null) e.prog=0; if(!e.color) e.color='#e85d25'; if(e.nombre==null) e.nombre=''; });
  p.areas.forEach(a=>{
    if(!a.id) a.id=uid();
    if(!Array.isArray(a.hitos)) a.hitos=[];
    if(!Array.isArray(a.notas)) a.notas=[];
    const std=ETAPAS_STD.find(e=>e.id===a.etapa); if(std) a.etapa=std.lbl;
  });
  return p;
}

/* ══ AVANCES ══ */
function avanceArea(a){
  if(a.hitos&&a.hitos.length) return Math.round(a.hitos.filter(h=>h.hecho).length/a.hitos.length*100);
  return Math.max(0,Math.min(100,Number(a.avance)||0));
}
function avanceGlobal(p){
  const as=(p.areas||[]).filter(a=>!a.excluida);
  if(!as.length){
    const es=p.etapas||[]; if(!es.length) return 0;
    return Math.round(es.reduce((s,e)=>s+(Number(e.prog)||0),0)/es.length);
  }
  let peso=0,acum=0;
  as.forEach(a=>{const w=Number(a.peso)||1;peso+=w;acum+=avanceArea(a)*w;});
  return peso?Math.round(acum/peso):0;
}
function colorAvance(v){ return v>=100?'var(--green)':v>=70?'var(--or2)':v>=35?'var(--yellow)':'var(--muted)'; }
function etapaActual(p){
  const es=p.etapas||[], h=hoy();
  return es.find(e=>(Number(e.prog)||0)>0&&(Number(e.prog)||0)<100)
      || es.find(e=>e.ini&&e.fin&&e.ini<=h&&e.fin>=h)
      || null;
}
function finPrevisto(p){ const f=(p.etapas||[]).map(e=>e.fin).filter(Boolean).sort(); return f.length?f[f.length-1]:(p.ffin||''); }
function hitosVencidos(p){ const v=[]; (p.areas||[]).forEach(a=>(a.hitos||[]).forEach(h=>{ if(!h.hecho&&h.fecha&&h.fecha<hoy()) v.push({a:a.lbl,h}); })); return v; }
function proximoHito(p){
  const t=[]; (p.areas||[]).forEach(a=>(a.hitos||[]).forEach(h=>{ if(!h.hecho) t.push({a:a.lbl,h}); }));
  return t.sort((x,y)=>String(x.h.fecha||'9').localeCompare(String(y.h.fecha||'9')))[0]||null;
}

/* ══════════════ COMPRAS (SC y comparativos del CC) ══════════════ */
async function _traerTodo(tabla,q){
  let out=[],from=0; const step=1000;
  for(let i=0;i<30;i++){
    const r=await fetch(SB_URL+'/rest/v1/'+tabla+'?'+q,{headers:{...H(),'Range-Unit':'items',Range:from+'-'+(from+step-1)},cache:'no-store'});
    if(!r.ok) throw new Error(tabla+' HTTP '+r.status);
    const j=await r.json(); out=out.concat(j);
    if(j.length<step) break; from+=step;
  }
  return out;
}
async function cargarCompras(forzar){
  if(!forzar&&_comprasOK&&Date.now()-_comprasTs<60000) return;
  try{
    const [s,c]=await Promise.all([
      _traerTodo('solicitudes_compra','select=num_sc,fecha,solicitante,area,os,os_asunto,os_desc,items,estado,pct_comprado,proyecto_asociado,criticidad,destino&order=fecha.desc'),
      _traerTodo('comparativas','select=num_comp,num_sc,divisa,proveedor_elegido,precio_elegido,precio_max,ahorro,estado,estado_autorizacion,fecha,creado_at&order=creado_at.desc')
    ]);
    SCS=s; CMPS=c; _comprasOK=true; _comprasTs=Date.now();
  }catch(e){ console.warn('compras:',e.message); _comprasTs=Date.now(); }
}
function scAsunto(s){
  if(!s) return '';
  return s.os_asunto||s.os_desc||String(s.items||'').split('\n')[0].replace(/\s+/g,' ').slice(0,90)||'(sin asunto)';
}
/* SC del proyecto = asociadas a mano en el CC/aquí (data.scs_asociadas)
   + las que el Formulario SC marcó con proyecto_asociado = N° del proyecto */
function scsDe(p){
  const man=(p.scs_asociadas||[]).map(String);
  const auto=SCS.filter(s=>p.num&&String(s.proyecto_asociado||'').trim()===String(p.num).trim()).map(s=>String(s.num_sc));
  return [...new Set([...man,...auto])].map(n=>({
    num:n, sc:SCS.find(s=>String(s.num_sc)===n)||null, manual:man.includes(n), cmp:cmpDe(n),
    rubro:(p.scs_rubro||{})[n]||''
  })).sort((a,b)=>String((b.sc||{}).fecha||'').localeCompare(String((a.sc||{}).fecha||'')));
}
/* Comparativo adjudicado de una SC: el aprobado más reciente con precio; si no hay aprobado, el último con precio */
function cmpDe(numSC){
  const cs=CMPS.filter(c=>String(c.num_sc)===String(numSC)&&Number(c.precio_elegido)>0&&c.estado_autorizacion!=='RECHAZADA');
  return cs.find(c=>c.estado_autorizacion==='APROBADA')||cs[0]||null;
}
function resumenCompras(p){
  const L=scsDe(p), r={n:L.length,pend:0,proc:0,comp:0,canc:0,ars:0,usd:0,ahorro:0,sinCmp:0,porRubro:{}};
  L.forEach(x=>{
    const e=((x.sc||{}).estado||'PENDIENTE').toUpperCase();
    if(e==='COMPLETADA') r.comp++; else if(e==='EN PROCESO') r.proc++; else if(e==='CANCELADA') r.canc++; else r.pend++;
    if(e==='CANCELADA') return;
    if(x.cmp){
      const m=Number(x.cmp.precio_elegido)||0;
      if(x.cmp.divisa==='USD') r.usd+=m; else { r.ars+=m; r.porRubro[x.rubro||'']=(r.porRubro[x.rubro||'']||0)+m; }
      r.ahorro+=x.cmp.divisa==='USD'?0:(Number(x.cmp.ahorro)||0);
    } else r.sinCmp++;
  });
  r.lista=L; return r;
}

function _ganttHTML(p,mini){
  const es=p.etapas||[], fechas=[];
  es.forEach(e=>{ if(e.ini)fechas.push(e.ini); if(e.fin)fechas.push(e.fin); });
  if(!fechas.length) return '<div class="muted" style="font-size:12.5px;padding:14px 0;font-style:italic">Sin fechas cargadas. Completá las etapas para ver el cronograma.</div>';
  fechas.sort();
  const ini=new Date(fechas[0]+'T00:00:00'), fin=new Date(fechas[fechas.length-1]+'T00:00:00');
  const total=Math.max(1,dias(ini,fin));
  const pos=f=>Math.max(0,Math.min(100,dias(ini,new Date(f+'T00:00:00'))/total*100));
  const hs=hoy(), posHoy=(hs>=fechas[0]&&hs<=fechas[fechas.length-1])?pos(hs):-1;
  let meses='',cur=new Date(ini.getFullYear(),ini.getMonth(),1);
  while(cur<=fin){
    const iso=cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0')+'-01';
    meses+='<div style="position:absolute;left:'+pos(iso)+'%;font-size:9px;color:var(--muted);white-space:nowrap">'
      +cur.toLocaleDateString('es-AR',{month:'short',year:'2-digit'})+'</div>';
    cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);
  }
  let h='<div class="gantt"><div class="gantt-grid"><div class="gantt-row"><div></div><div style="position:relative;height:15px">'+meses+'</div></div>';
  es.forEach(e=>{
    const col=e.color||'#e85d25';
    let barra='<span style="font-size:10px;color:var(--muted);padding-left:8px">—</span>';
    if(e.ini&&e.fin){
      const l=pos(e.ini), w=Math.max(2,pos(e.fin)-l), av=Math.max(0,Math.min(100,Number(e.prog)||0));
      barra='<div class="gantt-bar" style="left:'+l+'%;width:'+w+'%;background:'+col+'55;border:1px solid '+col+'">'
        +'<div style="position:absolute;left:0;top:0;bottom:0;width:'+av+'%;background:'+col+';border-radius:4px 0 0 4px"></div>'
        +'<span style="position:relative;z-index:2">'+av+'%</span></div>';
    }
    h+='<div class="gantt-row"><div class="gantt-lbl" title="'+esc(e.nombre)+'"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+col+';margin-right:6px"></span>'
      +esc(mini?String(e.nombre||'').split(' y ')[0]:e.nombre)+'</div><div class="gantt-track">'+barra
      +(posHoy>=0?'<div class="gantt-hoy" style="left:'+posHoy+'%"></div>':'')+'</div></div>';
  });
  return h+'</div></div>';
}
function setEtapa(i,campo,v){
  const e=current.etapas[i]; if(!e) return;
  e[campo]= campo==='prog' ? Math.max(0,Math.min(100,Number(v)||0)) : v;
  if(campo==='ini'&&e.fin&&v&&v>e.fin) e.fin=v;
  guardar(); render();
}
function agregarEtapa(){
  const last=current.etapas[current.etapas.length-1];

/* ══ PRESUPUESTO ══ */
/* Igual que el CC: IVA 21% si no está cargado; cada ítem tiene su moneda (ARS por defecto) */
function _ivaIt(it){ return (it.iva!=null&&it.iva!=='')?Number(it.iva):21; }
function _monIt(it){ return it.moneda==='USD'?'USD':'ARS'; }
function _totalRubro(r,mon){ mon=mon||'ARS';
  return ((r&&r.items)||[]).reduce((s,it)=>_monIt(it)!==mon?s:s+((Number(it.cant)||0)*(Number(it.precio)||0))*(1+_ivaIt(it)/100),0);
}
function _totalProy(p,mon){ return Object.keys(p.rubros||{}).reduce((s,k)=>s+_totalRubro(p.rubros[k],mon),0); }
function _usdTxt(p){ const u=_totalProy(p,'USD'); return u>0?' + US$ '+num(u):''; }
function vPresupuesto(){

/* ══ PORTAFOLIO ══ */
function _filaPf(p){
  const rc=_comprasOK?resumenCompras(p):null, ea=etapaActual(p), fp=finPrevisto(p), av=avanceGlobal(p);
  return {p, av, est:EST_PROY[p.estado||'planificacion']||EST_PROY.planificacion, ea, fp,
    atrasado:!!(fp&&fp<hoy()&&av<100&&!['finalizado','cancelado'].includes(p.estado)),
    venc:hitosVencidos(p).length, prox:proximoHito(p), pres:_totalProy(p), rc};
}
function _pfFiltrados(){
  const q=pfTxt.toLowerCase();
  return DB.filter(p=>{
    if(pfEst==='activos'&&['finalizado','cancelado'].includes(p.estado)) return false;
    if(pfEst!=='activos'&&pfEst!=='todos'&&(p.estado||'planificacion')!==pfEst) return false;
    return !q||[p.num,p.nombre,p.cliente,p.ubic,p.resp].join(' ').toLowerCase().indexOf(q)>=0;
  }).map(_filaPf);
}
function vPortafolio(){
  const F=DB.filter(p=>!['finalizado','cancelado'].includes(p.estado)).map(_filaPf);
  const prom=F.length?Math.round(F.reduce((s,f)=>s+f.av,0)/F.length):0;
  const venc=F.reduce((s,f)=>s+f.venc,0), pres=F.reduce((s,f)=>s+f.pres,0);
  const comp=F.reduce((s,f)=>s+(f.rc?f.rc.ars:0),0), scp=F.reduce((s,f)=>s+(f.rc?f.rc.pend:0),0);
  const atr=F.filter(f=>f.atrasado).length;
  let h='<div class="grid kpis">'
   +'<div class="kpi"><div class="v">'+F.length+'<span style="font-size:15px;color:var(--muted)">/'+DB.length+'</span></div><div class="l">Proyectos activos</div></div>'
   +'<div class="kpi"><div class="v" style="color:'+colorAvance(prom)+'">'+prom+'%</div><div class="l">Avance promedio</div><div class="bar" style="margin-top:7px"><i style="width:'+prom+'%"></i></div></div>'
   +'<div class="kpi"><div class="v" style="color:'+(venc?'var(--red)':'var(--green)')+'">'+venc+'</div><div class="l">Hitos vencidos</div></div>'
   +'<div class="kpi"><div class="v" style="color:'+(atr?'var(--red)':'var(--green)')+'">'+atr+'</div><div class="l">Con fin previsto vencido</div></div>'
   +'<div class="kpi"><div class="v" style="font-size:20px">$'+num(pres)+'</div><div class="l">Presupuesto activos</div></div>'
   +(_comprasOK?'<div class="kpi"><div class="v" style="font-size:20px">$'+num(comp)+'</div><div class="l">Comprometido · '+scp+' SC pend.</div></div>':'')
   +'</div>';
  h+='<div class="card"><div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center">'
   +'<div class="card-t" style="margin:0;flex:1">Todos los proyectos</div>'

  const c=clone(current);
  c.id=uid(); c.num=_nuevoNum(); c.nombre=nom.trim(); c.estado='planificacion';

    (c.etapas||[]).forEach(e=>{ e.prog=0; e.ini=''; e.fin=''; });

async function eliminarProyecto(){
  if(!current) return;
  if(!confirm('¿Eliminar el proyecto '+current.num+' — '+current.nombre+'?\n\nSe borra también del Centro de Control.')) return;
  const pin=prompt('Ingresá el código de confirmación:');
  if(pin===null) return;
  if(pin.trim()!=='1102'){ toast('⛔ Código incorrecto'); return; }
  const id=current.id; clearTimeout(_saveT[id]);
  try{
    const r=await fetch(SB_URL+'/rest/v1/proyectos?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:H()});
    if(!r.ok) throw new Error('HTTP '+r.status);
  }catch(e){ toast('⚠️ No se pudo borrar en la nube: '+e.message); return; }
  delete DIRTY[id]; delete BASE[id];
  DB=DB.filter(p=>p.id!==id); current=DB[0]||null; _cache();
  pintarSelector(); toast('🗑 Proyecto eliminado');
}

function renombrarRubro(k){
  const n=prompt('Nuevo nombre:',k); if(n===null||!n.trim()) return;
  const nk=n.trim().toUpperCase(); if(nk===k) return;
  if(current.rubros[nk]){ toast('Ya existe ese rubro'); return; }
  const o={}; Object.keys(current.rubros).forEach(x=>{ o[x===k?nk:x]=current.rubros[x]; }); current.rubros=o;
  Object.keys(current.scs_rubro||{}).forEach(s=>{ if(current.scs_rubro[s]===k) current.scs_rubro[s]=nk; });
  guardar(); render(); toast('Rubro renombrado');

  if(!confirm('¿Eliminar el rubro "'+k+'" y todos sus materiales?')) return;
  delete current.rubros[k];
  Object.keys(current.scs_rubro||{}).forEach(s=>{ if(current.scs_rubro[s]===k) delete current.scs_rubro[s]; });

}

function exportarPresupuesto(){
  const p=current, f=[['Rubro','Descripcion','Cantidad','Unidad','Precio_unit','Moneda','IVA','Subtotal_c_IVA']];
  Object.keys(p.rubros||{}).forEach(k=>(p.rubros[k].items||[]).forEach(it=>{
    const q=Number(it.cant)||0,pr=Number(it.precio)||0,tv=_ivaIt(it);
    f.push([k,it.desc||'',q,it.unidad||'',pr,_monIt(it),tv+'%',Math.round(q*pr*(1+tv/100))]);
  }));
  const csv=f.map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(';')).join('\n');
  const b=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b);
  a.download='Presupuesto_'+(p.num||'proyecto')+'.csv'; document.body.appendChild(a); a.click(); a.remove();
  toast('⬇️ Presupuesto exportado');
}

/* ── Documentos ── */
async function subirDoc(input){
  const fs=[...input.files]; if(!fs.length) return;
  const p=current; let ok=0;
  for(const f of fs){
    toast('⏳ Subiendo '+f.name+'…');
    const path='proyectos/'+String(p.num||'p').replace(/[^\w.-]/g,'_')+'/'+Date.now()+'_'+f.name.replace(/[^\w.-]/g,'_');
    let url='';
    try{
      const clean=path.split('/').map(encodeURIComponent).join('/');
      const r=await fetch(SB_URL+'/storage/v1/object/nielsen-archivos/'+clean,{method:'POST',
        headers:{...H(),'x-upsert':'true','Content-Type':f.type||'application/octet-stream'},body:f});
      if(r.ok) url=SB_URL+'/storage/v1/object/public/nielsen-archivos/'+clean;
    }catch(e){}
    if(!url){ toast('⚠️ No se pudo subir '+f.name); continue; }
    p.planos.push({id:uid(),file:f.name,url,fecha:hoy(),area:''}); ok++;
  }
  input.value='';
  if(ok){ if(current===p) guardar(); render(); toast('✅ '+ok+' documento(s) adjuntado(s)'); }
}
function borrarDoc(i){ if(!confirm('¿Quitar el documento?')) return; current.planos.splice(i,1); guardar(); render(); }
