<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestión de Proyectos — Nielsen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0c0a; --s1:#161310; --s2:#1f1b16; --s3:#2a251e; --s4:#342e25;
  --border:#3d3629; --border2:#4f4638;
  --or:#e85d25; --or2:#ff7440; --or3:#c44d1a; --gold:#c8a84b;
  --text:#ede8df; --muted:#7a6e5e; --subtle:#a89880;
  --green:#22c55e; --blue:#3b8ef3; --yellow:#f59e0b; --red:#ef4444; --purple:#a855f7;
  --ff:'IBM Plex Sans',sans-serif; --fm:'IBM Plex Mono',monospace; --fd:'Bebas Neue',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ff);background:var(--bg);color:var(--text);min-height:100vh;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  background-image:repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(255,255,255,.015) 39px,rgba(255,255,255,.015) 40px),
    repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(255,255,255,.015) 39px,rgba(255,255,255,.015) 40px);}
header{background:var(--s1);border-bottom:2px solid var(--or);padding:0 26px;height:66px;
  display:flex;align-items:center;gap:16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:60}
header img{height:38px}
.h-tit{font-family:var(--fd);font-size:25px;letter-spacing:2px;color:var(--text);line-height:1}
.h-tit span{color:var(--or)}
.h-sub{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.6px}
.wrap{max-width:1500px;margin:0 auto;padding:22px 26px 70px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px;flex-wrap:wrap}
.tab{padding:11px 18px;background:none;border:none;cursor:pointer;font-family:var(--ff);font-size:13px;
  font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:var(--or);border-bottom-color:var(--or)}
.tab:hover:not(.active){color:var(--subtle)}
.card{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px}
.card-t{font-family:var(--fd);font-size:15px;letter-spacing:1.4px;color:var(--or);text-transform:uppercase;margin-bottom:12px}
.btn{padding:9px 16px;border-radius:8px;border:none;background:var(--or);color:#fff;font-family:var(--ff);
  font-size:12.5px;font-weight:700;cursor:pointer;transition:.15s}
.btn:hover{background:var(--or2)}
.btn.sec{background:var(--s3);color:var(--text);border:1px solid var(--border2)}
.btn.sec:hover{background:var(--s4)}
.btn.dan{background:var(--red)}
.btn.sm{padding:5px 11px;font-size:11px}
.btn.gh{background:none;border:1px solid var(--border);color:var(--muted)}
.btn.gh:hover{color:var(--text);border-color:var(--border2)}
input,select,textarea{font-family:var(--ff);font-size:13px;padding:8px 11px;border-radius:7px;
  border:1px solid var(--border);background:var(--s2);color:var(--text);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--or)}
label{font-size:10px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);display:block;margin-bottom:4px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{padding:8px 10px;text-align:left;font-family:var(--fd);font-size:11px;letter-spacing:1.1px;
  text-transform:uppercase;color:var(--muted);background:var(--s2);border-bottom:2px solid var(--border)}
td{padding:7px 10px;border-bottom:1px solid var(--border)}
.mono{font-family:var(--fm)}
.grid{display:grid;gap:13px}
.kpi{background:var(--s1);border:1px solid var(--border);border-radius:11px;padding:14px 16px}
.kpi .v{font-family:var(--fd);font-size:27px;line-height:1;color:var(--or)}
.kpi .l{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-top:3px}
.bar{height:7px;background:var(--s3);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--or3),var(--or2));border-radius:4px;transition:width .4s}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:9.5px;font-weight:800;letter-spacing:.4px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.ov.on{display:flex}
.modal{background:var(--s1);border:1px solid var(--border2);border-radius:14px;max-width:660px;width:100%;
  max-height:90vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.65)}
.modal-h{padding:15px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.modal-h b{font-family:var(--fd);font-size:16px;letter-spacing:1.3px;color:var(--or)}
.modal-b{padding:18px 20px}
.modal-f{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:9px;justify-content:flex-end}
.muted{color:var(--muted)}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--s3);
  border:1px solid var(--or);border-radius:10px;padding:11px 20px;font-size:13px;z-index:300;
  opacity:0;pointer-events:none;transition:.25s}
.toast.on{opacity:1}
/* Gantt */
.gantt{overflow-x:auto;padding-bottom:6px}
.gantt-grid{min-width:780px}
.gantt-row{display:grid;grid-template-columns:190px 1fr;gap:10px;align-items:center;margin-bottom:6px}
.gantt-lbl{font-size:11.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gantt-track{position:relative;height:26px;background:var(--s2);border-radius:6px;border:1px solid var(--border)}
.gantt-bar{position:absolute;top:3px;height:20px;border-radius:5px;display:flex;align-items:center;
  padding:0 8px;font-size:10px;font-weight:700;color:#fff;overflow:hidden;white-space:nowrap}
.gantt-hoy{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--red);z-index:5}
@media(max-width:760px){
  header{padding:0 15px;height:60px}.wrap{padding:16px 13px 60px}
  .h-tit{font-size:20px}.card{padding:14px}
}
</style>
</head>

<script>
/* ══════════════════════════════════════════════════════════════
   GESTIÓN DE PROYECTOS — Nielsen Logística y Expediciones S.A.
   Panel por áreas, avance por área y global, dashboard y Gantt.
   Comparte la tabla `proyectos` de Supabase con el Centro de Control.
   ══════════════════════════════════════════════════════════════ */
const SB_URL='https://qivvewvgqlsptydftlhx.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFpdnZld3ZncWxzcHR5ZGZ0bGh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzMzkyMjUsImV4cCI6MjA5MTkxNTIyNX0.4PGflbub6rz5bdpabOFgHVwihBh2UFC5LRqwi93fLIo';
const LS='nielsen_proyectos_cache';

/* Etapas del proyecto — orden fijo del ciclo de obra */
const ETAPAS=[
  {id:'planificacion', lbl:'Planificación',              col:'#8b7cf6'},
  {id:'ejecucion',     lbl:'Ejecución',                  col:'#3b8ef3'},
  {id:'movilizacion',  lbl:'Movilización',               col:'#06b6d4'},
  {id:'armado',        lbl:'Armado',                     col:'#e85d25'},
  {id:'detalles',      lbl:'Detalles y entrega de llaves',col:'#c8a84b'},
  {id:'encurso',       lbl:'En curso',                   col:'#22c55e'},
  {id:'desarmado',     lbl:'Desarmado',                  col:'#f59e0b'},
  {id:'desmovilizacion',lbl:'Desmovilización',           col:'#7a6e5e'}
];
/* Áreas que suelen intervenir — se pueden agregar o quitar por proyecto */
const AREAS_BASE=[
  {id:'compras',    lbl:'Compras y Abastecimiento', ico:'🛒'},
  {id:'logistica',  lbl:'Logística y Transporte',   ico:'🚚'},
  {id:'obra',       lbl:'Obra y Montaje',           ico:'🏗️'},
  {id:'taller',     lbl:'Taller y Mantenimiento',   ico:'🔧'},
  {id:'gastronomia',lbl:'Gastronomía',              ico:'🍽️'},
  {id:'geologia',   lbl:'Geología',                 ico:'⛏️'},
  {id:'ssma',       lbl:'SSMA',                     ico:'🦺'},
  {id:'rrhh',       lbl:'RRHH',                     ico:'👥'},
  {id:'admin',      lbl:'Administración',           ico:'📑'}
];
const EST_PROY={
  planificacion:{lbl:'Planificación',col:'#8b7cf6'},
  ejecucion:{lbl:'En ejecución',col:'#3b8ef3'},
  pausado:{lbl:'Pausado',col:'#f59e0b'},
  finalizado:{lbl:'Finalizado',col:'#22c55e'},
  cancelado:{lbl:'Cancelado',col:'#ef4444'}
};

let DB=[], current=null, tabActual='dashboard';

/* ── Utilidades ── */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=v=>String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const num=n=>Math.round(Number(n)||0).toLocaleString('es-AR');
const hoy=()=>new Date().toISOString().slice(0,10);
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('on'),2600);}
function dias(a,b){ if(!a||!b) return 0; return Math.round((new Date(b)-new Date(a))/86400000); }

/* ── Persistencia (misma tabla que el Centro de Control) ── */
async function cargarNube(avisar){
  const el=document.getElementById('sync-est');
  if(el) el.textContent='⏳ sincronizando...';
  try{
    const r=await fetch(SB_URL+'/rest/v1/proyectos?select=*&order=num.asc&limit=500',
      {headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY},cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const rows=await r.json();
    DB=rows.map(x=> x.data
      ? {...x.data, id:x.id, num:x.num||x.data.num, nombre:x.nombre||x.data.nombre, estado:x.estado||x.data.estado}
      : {id:x.id,num:x.num,nombre:x.nombre,estado:x.estado,rubros:{},planos:[],etapas:[],areas:[]});
    DB.forEach(_normalizar);
    try{ localStorage.setItem(LS,JSON.stringify(DB)); }catch(e){}
    if(el) el.textContent='✓ '+DB.length+' proyecto(s)';
    if(avisar) toast('✅ Sincronizado con la nube');
  }catch(e){
    console.warn('nube:',e.message);
    try{ DB=JSON.parse(localStorage.getItem(LS)||'[]'); DB.forEach(_normalizar); }catch(e2){ DB=[]; }
    if(el) el.textContent='⚠ sin conexión — datos locales';
    if(avisar) toast('⚠️ No se pudo sincronizar — se muestran los datos guardados');
  }
  pintarSelector();
}
/* Completa la estructura nueva sin romper los proyectos ya cargados en el CC */
function _normalizar(p){
  if(!p.rubros) p.rubros={};
  if(!Array.isArray(p.planos)) p.planos=[];
  if(!Array.isArray(p.areas)) p.areas=[];
  if(!p.gantt) p.gantt={};
  ETAPAS.forEach(e=>{ if(!p.gantt[e.id]) p.gantt[e.id]={ini:'',fin:'',avance:0,obs:''}; });
  p.areas.forEach(a=>{ if(!Array.isArray(a.hitos)) a.hitos=[]; if(!Array.isArray(a.notas)) a.notas=[]; });
  return p;
}
async function guardar(){
  if(!current) return;
  try{ localStorage.setItem(LS,JSON.stringify(DB)); }catch(e){}
  const body={ num:current.num, nombre:current.nombre, estado:current.estado||'planificacion',
               data:current, actualizado_en:new Date().toISOString() };
  try{
    const r=await fetch(SB_URL+'/rest/v1/proyectos?id=eq.'+encodeURIComponent(current.id),{
      method:'PATCH',headers:{'Content-Type':'application/json',apikey:SB_KEY,
        Authorization:'Bearer '+SB_KEY,Prefer:'return=minimal'},body:JSON.stringify(body)});
    if(!r.ok && r.status===404) throw new Error('no existe');
    if(!r.ok) throw new Error('HTTP '+r.status);
  }catch(e){
    try{
      const r2=await fetch(SB_URL+'/rest/v1/proyectos',{method:'POST',
        headers:{'Content-Type':'application/json',apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,Prefer:'return=representation'},
        body:JSON.stringify({id:current.id,...body})});
      if(r2.ok){ const c=await r2.json(); if(c&&c[0]) current.id=c[0].id; }
    }catch(e2){ console.warn('guardar:',e2.message); }
  }
}

/* ══ AVANCES ══
   El avance de un área sale de sus hitos cumplidos; si no tiene hitos,
   se usa el porcentaje cargado a mano. El avance global es el promedio
   de las áreas ponderado por su peso. */
function avanceArea(a){
  if(a.hitos && a.hitos.length){
    const ok=a.hitos.filter(h=>h.hecho).length;
    return Math.round(ok/a.hitos.length*100);
  }
  return Math.max(0,Math.min(100,Number(a.avance)||0));
}
function avanceGlobal(p){
  const as=(p.areas||[]).filter(a=>!a.excluida);
  if(!as.length){
    /* Sin áreas cargadas: se toma el avance de las etapas del Gantt */
    const e=ETAPAS.map(x=>Number((p.gantt&&p.gantt[x.id]||{}).avance)||0);
    return Math.round(e.reduce((s,v)=>s+v,0)/ETAPAS.length);
  }
  let peso=0, acum=0;
  as.forEach(a=>{ const w=Number(a.peso)||1; peso+=w; acum+=avanceArea(a)*w; });
  return peso? Math.round(acum/peso) : 0;
}
function colorAvance(p){ return p>=100?'var(--green)':p>=70?'var(--or2)':p>=35?'var(--yellow)':'var(--muted)'; }

/* ── Selector y apertura de proyectos ── */
function pintarSelector(){
  const s=document.getElementById('sel-proy');
  s.innerHTML=DB.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.num||'')+' — '+esc(p.nombre||'')+'</option>').join('');
  const hay=DB.length>0;
  document.getElementById('sin-proy').style.display=hay?'none':'block';
  document.getElementById('cuerpo').style.display=hay?'block':'none';
  if(hay){ const id=(current&&DB.some(p=>p.id===current.id))?current.id:DB[0].id; s.value=id; abrirProyecto(id); }
}

function vGantt(){
  const p=current;
  let h='<div class="card"><div class="card-t">Cronograma por etapas</div>'
   +'<div class="muted" style="font-size:12px;margin-bottom:14px">Cargá las fechas de cada etapa y su avance. La línea roja marca el día de hoy.</div>'

  h+='<div class="card"><div class="card-t">Carga de etapas</div><table><thead><tr>'
   +'<th>Etapa</th><th style="width:135px">Desde</th><th style="width:135px">Hasta</th>'
   +'<th style="width:110px">Avance %</th><th style="width:90px">Días</th><th>Observaciones</th></tr></thead><tbody>';
  ETAPAS.forEach(e=>{
    const d=p.gantt[e.id]||{};
    h+='<tr><td><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:'+e.col+';margin-right:7px"></span><b>'+esc(e.lbl)+'</b></td>'
      +'<td><input type="date" value="'+esc(d.ini||'')+'" onchange="setEtapa(\''+e.id+'\',\'ini\',this.value)"></td>'
      +'<td><input type="date" value="'+esc(d.fin||'')+'" onchange="setEtapa(\''+e.id+'\',\'fin\',this.value)"></td>'
      +'<td><input type="number" min="0" max="100" value="'+(d.avance||0)+'" onchange="setEtapa(\''+e.id+'\',\'avance\',this.value)"></td>'
      +'<td class="muted" style="font-size:11.5px">'+(d.ini&&d.fin?(dias(d.ini,d.fin)+1)+'d':'—')+'</td>'
      +'<td><input value="'+esc(d.obs||'')+'" placeholder="—" onchange="setEtapa(\''+e.id+'\',\'obs\',this.value)"></td></tr>';
  });
  return h+'</tbody></table></div>';
}
function _ganttHTML(p,mini){
  const fechas=[];
  ETAPAS.forEach(e=>{const d=p.gantt[e.id]||{}; if(d.ini)fechas.push(d.ini); if(d.fin)fechas.push(d.fin);});
  if(!fechas.length) return '<div class="muted" style="font-size:12.5px;padding:14px 0;font-style:italic">Sin fechas cargadas. Completá las etapas para ver el cronograma.</div>';
  fechas.sort();
  const ini=new Date(fechas[0]), fin=new Date(fechas[fechas.length-1]);
  const total=Math.max(1,dias(ini,fin));
  const pos=f=>Math.max(0,Math.min(100,dias(ini,new Date(f))/total*100));
  const hy=new Date(); const posHoy=(hy>=ini&&hy<=fin)?pos(hy.toISOString().slice(0,10)):-1;
  /* Escala de meses */
  let meses='',cur=new Date(ini.getFullYear(),ini.getMonth(),1);
  while(cur<=fin){
    const p1=pos(cur.toISOString().slice(0,10));
    meses+='<div style="position:absolute;left:'+p1+'%;font-size:9px;color:var(--muted);white-space:nowrap">'
      +cur.toLocaleDateString('es-AR',{month:'short',year:'2-digit'})+'</div>';
    cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);
  }
  let h='<div class="gantt"><div class="gantt-grid">'
   +'<div class="gantt-row"><div></div><div style="position:relative;height:15px">'+meses+'</div></div>';
  ETAPAS.forEach(e=>{
    const d=p.gantt[e.id]||{};
    let barra='<span style="font-size:10px;color:var(--muted);padding-left:8px">—</span>';
    if(d.ini&&d.fin){
      const l=pos(d.ini), w=Math.max(2,pos(d.fin)-l);
      const av=Math.max(0,Math.min(100,Number(d.avance)||0));
      barra='<div class="gantt-bar" style="left:'+l+'%;width:'+w+'%;background:'+e.col+'55;border:1px solid '+e.col+'">'
        +'<div style="position:absolute;left:0;top:0;bottom:0;width:'+av+'%;background:'+e.col+';border-radius:4px 0 0 4px"></div>'
        +'<span style="position:relative;z-index:2">'+av+'%</span></div>';
    }
    h+='<div class="gantt-row"><div class="gantt-lbl">'
      +'<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:'+e.col+';margin-right:6px"></span>'
      +esc(mini?e.lbl.split(' y ')[0]:e.lbl)+'</div>'
      +'<div class="gantt-track">'+barra
      +(posHoy>=0?'<div class="gantt-hoy" style="left:'+posHoy+'%"></div>':'')+'</div></div>';
  });
  return h+'</div></div>';
}
function setEtapa(id,campo,val){
  if(!current.gantt[id]) current.gantt[id]={};
  current.gantt[id][campo]= campo==='avance' ? Math.max(0,Math.min(100,Number(val)||0)) : val;
  guardar(); render();
}

/* ══ PRESUPUESTO ══ (rubros y materiales, con IVA por ítem) */
function _totalRubro(r){
  return (r.items||[]).reduce((s,it)=>{
    const iva=(it.iva!=null?Number(it.iva):21);
    return s+((Number(it.cant)||0)*(Number(it.precio)||0))*(1+iva/100);
  },0);
}
function _totalProy(p){ return Object.keys(p.rubros||{}).reduce((s,k)=>s+_totalRubro(p.rubros[k]),0); }
function vPresupuesto(){
  const p=current, ks=Object.keys(p.rubros||{});
  let h='<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px">'
   +'<button class="btn" onclick="nuevoRubro()">➕ Nuevo rubro</button>'
   +'<button class="btn sec" onclick="exportarPresupuesto()">⬇️ Exportar</button></div>';
  if(!ks.length) return h+'<div class="card" style="text-align:center;padding:30px"><div class="muted">Sin rubros cargados.</div></div>';
  let neto=0, iva=0;
  ks.forEach(k=>{
    const r=p.rubros[k], its=r.items||[];
    let rn=0, ri=0;
    const filas=its.map((it,i)=>{
      const q=Number(it.cant)||0, pr=Number(it.precio)||0, tv=(it.iva!=null?Number(it.iva):21);
      const sn=q*pr, si=sn*tv/100; rn+=sn; ri+=si;
      return '<tr><td><input value="'+esc(it.desc||'')+'" onchange="setItem(\''+esc(k)+'\','+i+',\'desc\',this.value)"></td>'
        +'<td style="width:76px"><input type="number" value="'+(it.cant||'')+'" onchange="setItem(\''+esc(k)+'\','+i+',\'cant\',this.value)"></td>'

        +'<td style="width:105px"><input type="number" value="'+(it.precio||'')+'" onchange="setItem(\''+esc(k)+'\','+i+',\'precio\',this.value)"></td>'
        +'<td style="width:88px"><select onchange="setItem(\''+esc(k)+'\','+i+',\'iva\',this.value)">'
          +'<option value="21"'+(tv===21?' selected':'')+'>21%</option>'
          +'<option value="10.5"'+(tv===10.5?' selected':'')+'>10,5%</option>'
          +'<option value="0"'+(tv===0?' selected':'')+'>Exento</option></select></td>'
        +'<td style="width:120px;text-align:right;font-weight:700">$'+num(sn+si)+'</td>'
        +'<td style="width:34px"><button class="btn gh sm" onclick="borrarItem(\''+esc(k)+'\','+i+')">✕</button></td></tr>';
    }).join('');
    neto+=rn; iva+=ri;
    h+='<div class="card"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:11px">'
      +'<b style="font-family:var(--fd);font-size:15px;letter-spacing:1.2px;color:var(--or);flex:1">'+esc(k)+'</b>'
      +'<span style="font-size:13px;font-weight:700">$'+num(rn+ri)+'</span>'
      +'<button class="btn sec sm" onclick="agregarItem(\''+esc(k)+'\')">＋ Material</button>'
      +'<button class="btn gh sm" onclick="renombrarRubro(\''+esc(k)+'\')">✎</button>'
      +'<button class="btn gh sm" onclick="borrarRubro(\''+esc(k)+'\')">🗑</button></div>'
      +(its.length?('<table><thead><tr><th>Descripción</th><th>Cant.</th><th>Un.</th><th>P. unit. s/IVA</th><th>IVA</th><th style="text-align:right">Subtotal c/IVA</th><th></th></tr></thead><tbody>'+filas+'</tbody></table>')
        :'<div class="muted" style="font-size:12px;font-style:italic">Sin materiales.</div>')

  });
  h+='<div class="card" style="background:var(--s2)"><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">'
   +'<div><div class="l muted" style="font-size:10px;text-transform:uppercase">Neto s/IVA</div><div style="font-family:var(--fd);font-size:21px">$'+num(neto)+'</div></div>'

    +'<div><label>Cliente</label><input id="np-cli"></div>'

    +'<div><label>Responsable</label><input id="np-resp"></div>'
    +'<div><label>Áreas iniciales</label><select id="np-areas"><option value="si">Cargar las áreas habituales</option><option value="no">Empezar sin áreas</option></select></div>'
    +'</div>',
    '<button class="btn sec" onclick="cerrarOv()">Cancelar</button><button class="btn" onclick="_crearProy()">Crear</button>');
}
async function _crearProy(){
  const nom=val('np-nom'); if(!nom){ toast('El nombre es obligatorio'); return; }
  const p={ id:uid(), num:val('np-num')||_nuevoNum(), nombre:nom, estado:val('np-est')||'planificacion',
    cliente:val('np-cli'), ubic:val('np-ubi'), resp:val('np-resp'),
    creado:new Date().toISOString(), rubros:{}, planos:[], areas:[], gantt:{} };
  _normalizar(p);
  if(val('np-areas')==='si') p.areas=AREAS_BASE.map(a=>({id:uid(),...a,resp:'',peso:1,avance:0,etapa:'',hitos:[],notas:[]}));
  DB.push(p); current=p; await guardar(); cerrarOv(); pintarSelector(); toast('✅ '+p.num+' creado');
}
function editarProyecto(){
  if(!current) return; const p=current;
  abrirOv('Editar datos del proyecto',
    '<div class="grid" style="grid-template-columns:1fr 1fr">'
    +'<div><label>N°</label><input id="ep-num" value="'+esc(p.num||'')+'"></div>'
    +'<div><label>Estado</label><select id="ep-est">'+Object.keys(EST_PROY).map(k=>'<option value="'+k+'"'+(p.estado===k?' selected':'')+'>'+EST_PROY[k].lbl+'</option>').join('')+'</select></div>'
    +'<div style="grid-column:1/-1"><label>Nombre</label><input id="ep-nom" value="'+esc(p.nombre||'')+'"></div>'
    +'<div><label>Cliente</label><input id="ep-cli" value="'+esc(p.cliente||'')+'"></div>'
    +'<div><label>Ubicación</label><input id="ep-ubi" value="'+esc(p.ubic||'')+'"></div>'
    +'<div><label>Responsable</label><input id="ep-resp" value="'+esc(p.resp||'')+'"></div>'
    +'<div style="grid-column:1/-1"><label>Notas</label><textarea id="ep-not" rows="2">'+esc(p.notas||'')+'</textarea></div></div>',
    '<button class="btn sec" onclick="cerrarOv()">Cancelar</button><button class="btn" onclick="_guardarProy()">Guardar</button>');
}
async function _guardarProy(){
  Object.assign(current,{num:val('ep-num'),nombre:val('ep-nom'),estado:val('ep-est'),
    cliente:val('ep-cli'),ubic:val('ep-ubi'),resp:val('ep-resp'),notas:val('ep-not')});
  await guardar(); cerrarOv(); pintarSelector(); toast('Datos actualizados');
}
async function duplicarProyecto(){
  if(!current) return;
  const nom=prompt('Nombre del proyecto nuevo:', current.nombre+' (copia)');
  if(nom===null||!nom.trim()) return;
  const conAvance=confirm('¿Conservar el avance cargado?\n\nAceptar = copia con los avances\nCancelar = copia la estructura en cero');
  const c=JSON.parse(JSON.stringify(current));
  c.id=uid(); c.num=_nuevoNum(); c.nombre=nom.trim(); c.estado='planificacion';
  c.creado=new Date().toISOString(); c.duplicadoDe=current.num;
  c.planos=[];
  if(!conAvance){
    (c.areas||[]).forEach(a=>{ a.avance=0; a.notas=[]; (a.hitos||[]).forEach(h=>{h.hecho=false;}); });
    ETAPAS.forEach(e=>{ c.gantt[e.id]={ini:'',fin:'',avance:0,obs:''}; });
  }
  DB.push(c); current=c; await guardar(); pintarSelector(); toast('✅ '+c.num+' creado como copia');
}
async function eliminarProyecto(){
  if(!current) return;
  if(!confirm('¿Eliminar el proyecto '+current.num+' — '+current.nombre+'?\n\nSe borra también del Centro de Control.')) return;
  const pin=prompt('Ingresá el código de confirmación:');
  if(pin===null) return;
  if(pin.trim()!=='1102'){ toast('⛔ Código incorrecto'); return; }
  try{ await fetch(SB_URL+'/rest/v1/proyectos?id=eq.'+encodeURIComponent(current.id),
    {method:'DELETE',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}}); }catch(e){}
  DB=DB.filter(p=>p.id!==current.id); current=DB[0]||null;
  try{ localStorage.setItem(LS,JSON.stringify(DB)); }catch(e){}
  pintarSelector(); toast('🗑 Proyecto eliminado');
}

/* ── Áreas ── */
function agregarArea(){
  const usadas=(current.areas||[]).map(a=>a.lbl);
  const libres=AREAS_BASE.filter(a=>usadas.indexOf(a.lbl)<0);
  abrirOv('Agregar área',
    '<div><label>Área</label><select id="aa-sel" onchange="document.getElementById(\'aa-otra\').style.display=this.value===\'__otra__\'?\'block\':\'none\'">'
    +libres.map(a=>'<option value="'+a.id+'">'+a.ico+' '+a.lbl+'</option>').join('')
    +'<option value="__otra__">✏️ Otra (escribir)</option></select></div>'
    +'<div id="aa-otra" style="display:'+(libres.length?'none':'block')+';margin-top:10px"><label>Nombre del área</label><input id="aa-nom"></div>'
    +'<div class="grid" style="grid-template-columns:1fr 1fr;margin-top:10px">'
    +'<div><label>Responsable</label><input id="aa-resp"></div>'
    +'<div><label>Peso en el avance</label><input type="number" id="aa-peso" value="1" min="1" max="10"></div></div>'
    +'<div class="muted" style="font-size:11.5px;margin-top:9px">El peso define cuánto influye esta área en el avance global. '
    +'Un área con peso 3 pesa el triple que una con peso 1.</div>',
    '<button class="btn sec" onclick="cerrarOv()">Cancelar</button><button class="btn" onclick="_crearArea()">Agregar</button>');
}
async function _crearArea(){
  const sel=val('aa-sel'); let lbl='',ico='🏢';
  if(sel==='__otra__'){ lbl=val('aa-nom'); if(!lbl){ toast('Poné un nombre'); return; } }
  else { const b=AREAS_BASE.find(a=>a.id===sel); if(b){ lbl=b.lbl; ico=b.ico; } }
  current.areas.push({id:uid(),lbl:lbl,ico:ico,resp:val('aa-resp'),peso:Number(val('aa-peso'))||1,
    avance:0,etapa:'',hitos:[],notas:[]});
  await guardar(); cerrarOv(); render(); toast('Área agregada');
}
function editarArea(id){
  const a=current.areas.find(x=>x.id===id); if(!a) return;
  abrirOv('Editar '+a.lbl,
    '<div class="grid" style="grid-template-columns:1fr 1fr">'
    +'<div style="grid-column:1/-1"><label>Nombre</label><input id="ea-lbl" value="'+esc(a.lbl)+'"></div>'
    +'<div><label>Responsable</label><input id="ea-resp" value="'+esc(a.resp||'')+'"></div>'
    +'<div><label>Peso</label><input type="number" id="ea-peso" value="'+(a.peso||1)+'" min="1" max="10"></div>'
    +'<div><label>Etapa en la que interviene</label><select id="ea-etapa"><option value="">—</option>'
      +ETAPAS.map(e=>'<option value="'+e.id+'"'+(a.etapa===e.id?' selected':'')+'>'+e.lbl+'</option>').join('')+'</select></div>'
    +'<div><label>Avance manual %</label><input type="number" id="ea-av" value="'+(a.avance||0)+'" min="0" max="100"'
      +((a.hitos&&a.hitos.length)?' disabled':'')+'></div></div>'
    +((a.hitos&&a.hitos.length)?'<div class="muted" style="font-size:11.5px;margin-top:9px">El avance se calcula con los hitos cargados. Para usar el porcentaje manual, quitá los hitos.</div>':''),
    '<button class="btn sec" onclick="cerrarOv()">Cancelar</button><button class="btn" onclick="_guardarArea(\''+id+'\')">Guardar</button>');
}
async function _guardarArea(id){
  const a=current.areas.find(x=>x.id===id); if(!a) return;
  a.lbl=val('ea-lbl')||a.lbl; a.resp=val('ea-resp'); a.peso=Number(val('ea-peso'))||1;
  a.etapa=val('ea-etapa'); if(!(a.hitos&&a.hitos.length)) a.avance=Number(val('ea-av'))||0;
  await guardar(); cerrarOv(); render(); toast('Área actualizada');
}
async function borrarArea(id){
  const a=current.areas.find(x=>x.id===id); if(!a) return;
  if(!confirm('¿Quitar el área "'+a.lbl+'" del proyecto?\n\nSe pierden sus hitos y novedades.')) return;
  current.areas=current.areas.filter(x=>x.id!==id);
  await guardar(); render(); toast('Área quitada');
}
function agregarHito(id){
  const a=current.areas.find(x=>x.id===id); if(!a) return;
  abrirOv('Nuevo hito — '+a.lbl,
    '<div><label>Descripción *</label><input id="nh-txt" placeholder="Ej: Entrega de materiales en obra"></div>'
    +'<div style="margin-top:10px"><label>Fecha comprometida</label><input type="date" id="nh-fec"></div>',
    '<button class="btn sec" onclick="cerrarOv()">Cancelar</button><button class="btn" onclick="_crearHito(\''+id+'\')">Agregar</button>');
}
async function _crearHito(id){
  const a=current.areas.find(x=>x.id===id); if(!a) return;
  const t=val('nh-txt'); if(!t){ toast('Poné una descripción'); return; }
  a.hitos.push({txt:t,fecha:val('nh-fec'),hecho:false});
  await guardar(); cerrarOv(); render(); toast('Hito agregado');
}
async function toggleHito(id,i,on){
  const a=current.areas.find(x=>x.id===id); if(!a||!a.hitos[i]) return;
  a.hitos[i].hecho=on; if(on) a.hitos[i].cumplido=hoy();
  await guardar(); render();
}
async function borrarHito(id,i){
  const a=current.areas.find(x=>x.id===id); if(!a) return;
  a.hitos.splice(i,1); await guardar(); render();
}
function agregarNota(id){
  const a=current.areas.find(x=>x.id===id); if(!a) return;
  abrirOv('Novedad — '+a.lbl,
    '<div><label>¿Qué pasó?</label><textarea id="nn-txt" rows="3" placeholder="Ej: Se demoró la entrega de perfiles, reprogramado para el viernes"></textarea></div>',
    '<button class="btn sec" onclick="cerrarOv()">Cancelar</button><button class="btn" onclick="_crearNota(\''+id+'\')">Guardar</button>');
}
async function _crearNota(id){
  const a=current.areas.find(x=>x.id===id); if(!a) return;
  const t=val('nn-txt'); if(!t){ toast('Escribí la novedad'); return; }
  a.notas.push({f:hoy(),t:t}); await guardar(); cerrarOv(); render(); toast('Novedad cargada');
}

/* ── Presupuesto ── */
async function nuevoRubro(){
  const n=prompt('Nombre del rubro:'); if(n===null||!n.trim()) return;
  const k=n.trim().toUpperCase();
  if(current.rubros[k]){ toast('Ya existe ese rubro'); return; }
  current.rubros[k]={items:[],cotiz:[]}; await guardar(); render(); toast('Rubro creado');
}
async function renombrarRubro(k){
  const n=prompt('Nuevo nombre:',k); if(n===null||!n.trim()) return;
  const nk=n.trim().toUpperCase(); if(nk===k) return;
  if(current.rubros[nk]){ toast('Ya existe ese rubro'); return; }
  const o={}; Object.keys(current.rubros).forEach(x=>{ o[x===k?nk:x]=current.rubros[x]; });
  current.rubros=o; await guardar(); render(); toast('Rubro renombrado');
}
async function borrarRubro(k){
  if(!confirm('¿Eliminar el rubro "'+k+'" y todos sus materiales?')) return;
  delete current.rubros[k]; await guardar(); render();
}
async function agregarItem(k){
  current.rubros[k].items.push({desc:'',cant:'',unidad:'u',precio:'',iva:21});
  await guardar(); render();
}
async function setItem(k,i,campo,v){
  const it=current.rubros[k].items[i]; if(!it) return;
  it[campo]= (campo==='cant'||campo==='precio'||campo==='iva') ? Number(v)||0 : v;
  await guardar(); render();
}
async function borrarItem(k,i){ current.rubros[k].items.splice(i,1); await guardar(); render(); }
function exportarPresupuesto(){
  const p=current, f=[['Rubro','Descripcion','Cantidad','Unidad','Precio_unit','IVA','Subtotal_c_IVA']];
  Object.keys(p.rubros||{}).forEach(k=>(p.rubros[k].items||[]).forEach(it=>{
    const q=Number(it.cant)||0,pr=Number(it.precio)||0,tv=(it.iva!=null?Number(it.iva):21);
    f.push([k,it.desc||'',q,it.unidad||'',pr,tv+'%',Math.round(q*pr*(1+tv/100))]);
  }));
  const csv=f.map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const b=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b);
  a.download='Presupuesto_'+(p.num||'proyecto')+'.csv'; a.click();
  toast('⬇️ Presupuesto exportado');
}

/* ── Documentos ── */
async function subirDoc(input){
  const fs=[...input.files]; if(!fs.length) return;
  for(const f of fs){
    toast('⏳ Subiendo '+f.name+'...');
    const path='proyectos/'+String(current.num||'p').replace(/[^\w.-]/g,'_')+'/'+Date.now()+'_'+f.name.replace(/[^\w.-]/g,'_');
    let url='';
    try{
      const clean=path.split('/').map(encodeURIComponent).join('/');
      const r=await fetch(SB_URL+'/storage/v1/object/nielsen-archivos/'+clean,{method:'POST',
        headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'x-upsert':'true','Content-Type':f.type||'application/octet-stream'},body:f});
      if(r.ok) url=SB_URL+'/storage/v1/object/public/nielsen-archivos/'+clean;
    }catch(e){}
    if(!url){ toast('⚠️ No se pudo subir '+f.name); continue; }
    current.planos.push({id:uid(),file:f.name,url:url,fecha:hoy(),area:''});
  }
  input.value=''; await guardar(); render(); toast('✅ Documentos adjuntados');
}
async function borrarDoc(i){ if(!confirm('¿Quitar el documento?')) return; current.planos.splice(i,1); await guardar(); render(); }

/* ── Arranque ── */
document.getElementById('ov').addEventListener('click',e=>{ if(e.target.id==='ov') cerrarOv(); });
cargarNube(false);
